# yaml-language-server: $schema=https://cubic3d.github.io/crd-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname project-zomboid
  namespace: &namespace game
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  path: kubernetes/apps/game/project-zomboid/app
  interval: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: openebs
      namespace: openebs
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      app: *appname
      kopiur_capacity: 2Gi
      kopiur_mover_uid: "1000"
      kopiur_mover_gid: "1000"
