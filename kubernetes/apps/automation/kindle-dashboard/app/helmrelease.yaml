# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kindle-dashboard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    controllers:
      dashboard:
        pod:
          imagePullSecrets:
            - name: kindle-dashboard-pull

        containers:
          app:
            image:
              repository: ghcr.io/cubic3d/kindle-dashboard
              tag: 1.0.0

            envFrom:
              - secretRef:
                  name: kindle-dashboard

            env:
              TZ: Europe/Berlin

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: 4321

    route:
      app:
        hostnames:
          - kindle-dashboard.${domain}
        parentRefs:
          - name: envoy-internal
            namespace: network
