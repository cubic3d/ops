# yaml-language-server: $schema=https://cubic3d.github.io/crd-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kindle-dashboard
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        RUCKUS_URL: "{{ .r_url }}"
        RUCKUS_USER: "{{ .r_kindle_dashboard_user }}"
        RUCKUS_PASSWORD: "{{ .r_kindle_dashboard_password }}"

  dataFrom:
    - extract:
        key: ruckus
      rewrite:
        - regexp:
            source: (.*)
            target: r_$1
