# yaml-language-server: $schema=https://cubic3d.github.io/crd-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepass
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        ADMIN_PASSWORD: "{{ .h_password }}"
        HA_TOKEN: "{{ .ha_homepass_token }}"

  dataFrom:
    - extract:
        key: homepass
      rewrite:
        - regexp:
            source: "(.*)"
            target: "h_$1"

    - extract:
        key: home-assistant
      rewrite:
        - regexp:
            source: "(.*)"
            target: "ha_$1"
