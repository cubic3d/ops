# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepass
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    controllers:
      homepass:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/ljmerza/homepass
              tag: 1.5.0

            envFrom:
              - secretRef:
                  name: homepass

            env:
              TZ: Europe/Berlin
              ADMIN_USERNAME: cubic
              HA_BASE_URL: http://home-assistant:8123
              PORT: &port 5880
              GUEST_URL: https://hp.${domain}
              LOCAL_NETWORK_CIDRS: 192.168.0.0/16

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              readiness: *probes
              startup: *probes

            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.longhorn.io/create-default-disk
                    operator: In
                    values:
                      - "true"
                      - config

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - hp.${domain}
        parentRefs:
          - name: envoy-internal
            namespace: network

      external:
        labels:
          k8s-gateway.dns/ignore: "true"
        hostnames:
          - hp.${domain}
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /g
            backendRefs:
              - identifier: app
                port: http

    persistence:
      data:
        existingClaim: homepass
