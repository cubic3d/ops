# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app echomuse
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    controllers:
      echomuse:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "network",
                "ips": ["192.168.10.65/24"],
                "mac": "ba:88:d0:8a:ba:ca"
              }]

        containers:
          app:
            image:
              repository: ghcr.io/wilbowes/echomuse-controller
              tag: 2.22.0

            env:
              TZ: Europe/Berlin
              API_PORT: &port 8768
              SERVER_IP: 192.168.10.65
              OWW_MODEL: hey_jarvis
              OWW_THRESHOLD: 0.5
              DB_PATH: /data/echomuse.db

            resources:
              requests:
                cpu: 100m
                memory: 400Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.longhorn.io/create-default-disk
                    operator: In
                    values:
                      - "true"
                      - config

    service:
      echomuse:
        controller: echomuse
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - echomuse.${domain}
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: echomuse
