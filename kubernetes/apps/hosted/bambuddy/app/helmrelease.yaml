# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bambuddy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    controllers:
      bambuddy:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "network",
                "ips": ["192.168.10.67/24"],
                "mac": "82:64:bb:76:4b:50"
              }]
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.longhorn.io/create-default-disk
                        operator: In
                        values:
                          - "true"
                          - config

        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.3.1

            env:
              TZ: Europe/Berlin
              PORT: &bambuddyPort 8000
              BAMBU_STUDIO_API_URL: http://bambuddy-slicer-api:3000

            probes:
              liveness: &bambuddyProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *bambuddyPort
              readiness: *bambuddyProbes
              startup: *bambuddyProbes

            resources:
              requests:
                cpu: 50m
                memory: 250Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL

      slicer-api:
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.3.1@sha256:65170b2f1703aa688fe3020e67e942999b3a57c5b858dfe78a3cb30f2c481abb

            env:
              TZ: Europe/Berlin
              PORT: &slicerApiPort 3000

            probes:
              liveness: &slicerApiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *slicerApiPort
              readiness: *slicerApiProbes
              startup: *slicerApiProbes

            resources:
              requests:
                cpu: 50m
                memory: 250Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    service:
      bambuddy:
        controller: bambuddy
        ports:
          http:
            port: *bambuddyPort

      slicer-api:
        controller: slicer-api
        ports:
          http:
            port: *slicerApiPort

    route:
      bambuddy:
        hostnames:
          - bambuddy.${domain}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: bambuddy
                port: http

    persistence:
      data:
        existingClaim: bambuddy
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data

      logs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /app/logs

      slicer-data:
        type: emptyDir
        advancedMounts:
          slicer-api:
            app:
              - path: /app/data

      tmp:
        type: emptyDir
