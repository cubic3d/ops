# yaml-language-server: $schema=https://cubic3d.github.io/crd-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8s-gateway
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    replicaCount: 2

    servers:
      - zones:
          - zone: ${domain}
        port: 53
        plugins:
          - name: k8s_gateway
            parameters: ${domain}
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute TLSRoute GRPCRoute Ingress Service
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance

    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.40.62"
