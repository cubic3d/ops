# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
  - default.yaml

releases:
  - name: cilium
    namespace: kube-system
    hooks:
      - # Wait for Cilium CRDs to be available
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/ciliumbgpadvertisements.cilium.io
          - crd/ciliumbgpclusterconfigs.cilium.io
          - crd/ciliumbgppeerconfigs.cilium.io
          - crd/ciliumloadbalancerippools.cilium.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Apply cilium network configuration
        command: kubectl
        args:
          - apply
          - --namespace={{ .Release.Namespace }}
          - --server-side
          - --force-conflicts
          - --kustomize=../../apps/kube-system/cilium/config/
        events:
          - postsync
        showlogs: true

  - name: coredns
    namespace: kube-system
    needs:
      - kube-system/cilium

  - name: cert-manager
    namespace: cert-manager
    needs:
      - kube-system/coredns

  - name: external-secrets
    namespace: secrets
    needs:
      - cert-manager/cert-manager

  - name: onepassword-connect
    namespace: secrets
    needs:
      - secrets/external-secrets
    hooks:
      - # Wait for CRDs to be available
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/clustersecretstores.external-secrets.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Apply ClusterSecretStore
        command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - --filename=../../apps/secrets/external-secrets/stores/onepassword.yaml
        events:
          - postsync
        showlogs: true

  - name: kubelet-csr-approver
    namespace: system
    needs:
      - secrets/onepassword-connect

  - name: spegel
    namespace: system
    needs:
      - system/kubelet-csr-approver

  - name: flux-operator
    namespace: flux-system
    needs:
      - system/spegel

  - name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
